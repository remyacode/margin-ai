name: Keep Alive - Supabase & Cloud Run

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloud Run
        run: curl -s https://margin-ai-1059250826101.us-central1.run.app/ > /dev/null

      - name: Ping Supabase directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -s \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/sku_margins?select=id&limit=1" > /dev/null
          echo "✅ Supabase pinged"
