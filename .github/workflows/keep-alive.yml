name: Keep Alive - Supabase & Cloud Run

on:
  schedule:
    - cron: '0 3 * * *'  # every day at 8:30am IST (3:00 UTC)
  workflow_dispatch:       # lets you trigger manually too

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Cloud Run (keeps Supabase active via backend)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://margin-ai-1059250826101.us-central1.run.app/)
          echo "Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 500 ]; then
            echo "✅ Service alive"
          else
            echo "⚠️ Unexpected status: $STATUS"
          fi
